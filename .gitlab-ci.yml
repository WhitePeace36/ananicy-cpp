---
image: gcc

variables:
  GIT_SUBMODULE_STRATEGY: recursive


default:
  before_script:
    - apt-get -y update
    - apt-get -y install build-essential cmake git libsystemd-dev llvm clang

build:
  stage: build
  script:
    - cmake -B build -DCMAKE_BUILD_TYPE=Release -S .
    - cmake --build build -j

build-static:
  stage: build
  script:
    - cmake -B build -DCMAKE_BUILD_TYPE=Release -DSTATIC=On -DENABLE_SYSTEMD=Off -S .
    - cmake --build build -j
  artifacts:
    paths:
      - build/ananicy-cpp
    expire_in: 1 week

# Inspired by https://stackoverflow.com/a/65478446/6061951
persist-tag-artifacts:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_TAG != null'
  script:
    - echo "Persisting artifacts for tag pipelines"
  artifacts:
    paths:
      - build/ananicy-cpp
    expire_in: never
